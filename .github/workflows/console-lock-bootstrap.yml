name: Console lockfile bootstrap
on:
  pull_request:
    branches: [main]
    paths: ['apps/console/package.json']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: node -e 'const s=require("node:fs").readFileSync("pnpm-lock.yaml").toString("base64"); for(let i=0;i<s.length;i+=2000) console.log("LOCK:"+s.slice(i,i+2000))'
