name: Deploy Reviewer to Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'scripts/sync-vercel-env.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'
permissions:
  contents: read
concurrency:
  group: reviewer-vercel-production
  cancel-in-progress: false
env:
  VERCEL_ORG_ID: team_hAp7kLycu6rwgAWypgcghemA
  VERCEL_PROJECT_ID: prj_RKccMkGPH0rn8GteNrNN2hQiaik5
  VERCEL_CLI_VERSION: '58.4.4'
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.VERCEL_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Sync authorized reviewer configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          REVIEWER_APP_ID: ${{ vars.REVIEWER_APP_ID || secrets.REVIEWER_APP_ID }}
          REVIEWER_APP_SLUG: ${{ vars.REVIEWER_APP_SLUG || secrets.REVIEWER_APP_SLUG }}
          REVIEWER_APP_ENABLED: ${{ vars.REVIEWER_APP_ENABLED || secrets.REVIEWER_APP_ENABLED }}
          REVIEWER_WEBHOOK_SECRET: ${{ secrets.REVIEWER_WEBHOOK_SECRET }}
          REVIEWER_QUEUE_ENABLED: ${{ vars.REVIEWER_QUEUE_ENABLED || 'false' }}
          REVIEWER_AUTO_MERGE_ENABLED: ${{ vars.REVIEWER_AUTO_MERGE_ENABLED || 'true' }}
        run: node scripts/sync-vercel-env.mjs
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production
      - run: pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" build --prod
      - name: Stage production
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --skip-domain --yes)"
          DEPLOYMENT_URL="$url" node --input-type=module -e 'const u = new URL(process.env.DEPLOYMENT_URL); if (u.protocol !== "https:" || u.origin !== process.env.DEPLOYMENT_URL || !u.hostname.endsWith(".vercel.app")) process.exit(1)'
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test staged endpoint
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          REVIEWER_WEBHOOK_SECRET: ${{ secrets.REVIEWER_WEBHOOK_SECRET }}
        run: |
          node --input-type=module -e '
            const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
            if (!secret) throw new Error("Configure VERCEL_AUTOMATION_BYPASS_SECRET for protected staging");
            const endpoint = new URL("/api/github", process.env.DEPLOYMENT_URL);
            const response = await fetch(endpoint, { headers: { "x-vercel-protection-bypass": secret }, redirect: "error", signal: AbortSignal.timeout(30000) });
            if (!response.ok || (await response.json()).status !== "ok") throw new Error("Staged endpoint failed health check");
            const webhook = process.env.REVIEWER_WEBHOOK_SECRET;
            if (webhook) {
              const { createHmac } = await import("node:crypto");
              const body = "{}";
              const headers = { "x-vercel-protection-bypass": secret, "content-type": "application/json", "x-github-event": "ping" };
              const unsigned = await fetch(endpoint, { method: "POST", headers, body, redirect: "error", signal: AbortSignal.timeout(30000) });
              if (unsigned.status !== 401) throw new Error("Unsigned webhook was not rejected");
              const signature = "sha256=" + createHmac("sha256", webhook).update(body).digest("hex");
              const signed = await fetch(endpoint, { method: "POST", headers: { ...headers, "x-hub-signature-256": signature }, body, redirect: "error", signal: AbortSignal.timeout(30000) });
              if (signed.status !== 200) throw new Error("Signed webhook ping failed");
            }
          '
      - name: Promote tested deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" promote "$DEPLOYMENT_URL" --yes
