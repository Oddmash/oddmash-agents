name: Agent Review
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Full public repository name (leave blank for a manual scan)
        type: string
        required: false
      pr_number:
        description: PR number (required for a targeted review)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: organization-reviewer-${{ inputs.repository || 'scan' }}-${{ inputs.pr_number || 'all' }}
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main' && vars.REVIEWER_APP_ID != '' && vars.REVIEWER_APP_SLUG != '' && vars.REVIEWER_APP_ENABLED == 'true' && (github.event_name != 'schedule' || vars.REVIEWER_EVENT_MODE != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Find exact-revision CI evidence
        id: prior
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { findGitHubTests } from './scripts/ci-evidence.mjs';
          const run = await findGitHubTests({
            repository: process.env.GITHUB_REPOSITORY,
            head: process.env.GITHUB_SHA,
            revision: process.env.GITHUB_SHA,
            event: 'push',
            branch: 'main',
            headRepository: Number(process.env.GITHUB_REPOSITORY_ID),
          }, process.env.GITHUB_TOKEN);
          if (run) appendFileSync(process.env.GITHUB_OUTPUT, 'run=' + run + '\n');
          NODE
      - name: Run tests when exact CI evidence is unavailable
        if: steps.prior.outputs.run == ''
        run: pnpm test
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          owner: Oddmash
          repositories: .github,interaction-inspector,oddmash-ui,Vertactics,kowrap,boundra
          permission-contents: read
          permission-pull-requests: write
          permission-checks: read
      - name: Review opted-in public PRs
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4
          REVIEWER_APP_SLUG: ${{ vars.REVIEWER_APP_SLUG }}
          REVIEWER_APP_ID: ${{ vars.REVIEWER_APP_ID }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
        run: node src/organization.ts
