name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@9a2077a4b0ff9188ef2cb2ab306f181a134d3110
    with:
      profile: agents
  test:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm test

  verify:
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm appropriate checks passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_0: ${{ needs.scope.outputs.runtime }}
          RESULT_0: ${{ needs.test.result }}
        run: |
          test "$SCOPE_RESULT" = success
          verify() { case "$1:$2" in true:success|false:skipped) return 0 ;; *) return 1 ;; esac; }
          verify "$RUN_0" "$RESULT_0"
