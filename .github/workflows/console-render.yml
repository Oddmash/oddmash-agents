name: Console render
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/console/**'
      - 'packages/operator-contract/**'
      - 'scripts/console-render.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/console-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated browser harness
        run: |
          mkdir -p "$RUNNER_TEMP/console-browser"
          cd "$RUNNER_TEMP/console-browser"
          pnpm init
          pnpm add --save-exact --ignore-scripts playwright@1.56.1
          pnpm exec playwright install --with-deps chromium
      - name: Render synthetic observations with locked product dependencies
        run: CONSOLE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/console-browser/node_modules/playwright/index.mjs" node scripts/console-render.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: console-render-evidence
          path: render-evidence/
          if-no-files-found: warn
